plugins {
    id 'fabric-loom' version '1.7.4'
    id 'java'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Mojang"
        url = "https://libraries.minecraft.net"
    }
    maven {
        name = "Maven Mirror"
        url = "https://repo.maven.apache.org/maven2/"
    }
    // JitPack - chứa Orbit library
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
    }
    // ⭐ Ladysnake - chứa Satin library
    maven {
        name = "Ladysnake Mods"
        url = "https://maven.ladysnake.org/releases"
    }
    // ⭐ Terraformers - chứa các thư viện bổ trợ khác
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    // Orbit event bus
    implementation 'com.github.MeteorDevelopment:orbit:0.2.3'
    
    // ⭐ Satin - thư viện shader (GIẢI QUYẾT LỖI ManagedCoreShader, Uniform1f, Uniform2f, v.v.)
    modImplementation include("org.ladysnake:satin:${project.satin_version}")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    
    filesMatching("fabric.mod.json") {
        expand (
            "version": project.version,
            "minecraft_version": project.minecraft_version,
            "loader_version": project.loader_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
}
