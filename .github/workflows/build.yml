name: Build Acore Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      
      - name: Fix class names (ArisCore/AcoreHack -> Acore)
        run: |
          echo "Fixing class names to Acore..."
          find src -name "*.java" -exec sed -i 's/ArisCore/Acore/g' {} \;
          find src -name "*.java" -exec sed -i 's/AcoreHack/Acore/g' {} \;
          echo "Done fixing class names!"
      
      - name: Fix event imports
        run: |
          echo "Fixing event imports..."
          find src -name "*.java" -exec sed -i 's/acore\.hack\.events\.impl/acore.hack.event.impl/g' {} \;
          echo "Done fixing event imports!"
      
      - name: Build Mod
        run: gradle build --no-daemon --stacktrace
      
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Acore-1.21
          path: build/libs/*.jar
