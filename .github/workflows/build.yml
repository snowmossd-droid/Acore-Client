name: Build AcoreHack Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AcoreHack-Mod
        path: build/libs/*.jar
    
    - name: List build outputs
      run: |
        echo "Build completed successfully!"
        ls -la build/libs/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        body: |
          ## AcoreHack Mod Release
          - Minecraft Version: 1.21
          - Fabric Version: 0.100.3+1.21
          
          ### Features:
          - ESP (Player & Block)
          - Kill Aura with Legit Mode
          - Friend System
          - BowSpam, TargetStrafe, HitBox
          - AutoTNTcart
          - GUI with Keybind System (Press P)
          - Config Manager
          - Sound Click Effects
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
