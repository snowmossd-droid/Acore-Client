name: Build AcoreHack Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      
      - name: Fix imports automatically
        run: |
          echo "Fixing package imports (events -> event)..."
          find src -name "*.java" -exec sed -i 's/acore\.hack\.events\.impl/acore.hack.event.impl/g' {} \;
          
          echo "Adding missing PacketEvent imports..."
          find src -name "*.java" -exec sed -i '/^package /a import acore.hack.event.impl.PacketEvent;' {} \;
          
          echo "Adding missing MethodHandles import to EventBus..."
          find src -name "EventBus.java" -exec sed -i '/^package /a import java.lang.invoke.MethodHandles;' {} \;
          
          echo "Done fixing imports!"
      
      - name: Build Mod
        run: gradle build --no-daemon --stacktrace
      
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AcoreHack-1.21
          path: build/libs/*.jar
