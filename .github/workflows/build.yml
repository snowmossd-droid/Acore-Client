name: Build AcoreHack Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      
      - name: Fix event imports
        run: |
          echo "Fixing event package (events -> event)..."
          find src -name "*.java" -exec sed -i 's/import acore\.hack\.events\.impl/import acore.hack.event.impl/g' {} \;
          echo "Done!"
      
      - name: Build Mod
        run: gradle build --no-daemon --stacktrace
      
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AcoreHack-1.21
          path: build/libs/*.jar
